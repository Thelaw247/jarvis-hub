[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-hub"
version = "0.27.3"   # the VERSION file is the source of truth; the release skill keeps this in step
description = "Jarvis hub: the desktop app for De Wet's personal assistant (demo backend until jarvis-core exists)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pymupdf>=1.24",   # the reader's question index and page thumbnails (jarvis_hub/pdfindex.py, thumbs.py)
  "pillow>=10",      # thumbnails as small WebP files (jarvis_hub/thumbs.py)
  "httpx>=0.27",     # live mode: the hub talks to jarvis-core (jarvis_hub/live.py, keys_proxy.py)
  "pyyaml>=6",       # the tools folder's TOOL.md front matter (jarvis/tools/registry.py)
]

[project.optional-dependencies]
desktop = ["pywebview>=5.3"]
dev = ["pytest>=8", "httpx>=0.27", "jsonschema>=4.23", "ruff>=0.6", "playwright>=1.47"]
# jarvis-core on Laptop B (setup-core.bat installs these): the API, the keys in Credential Manager, the memory store
core = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "keyring>=25", "sqlite-vec>=0.1.9"]
# the voice client (Laptop A, or B): mic and speakers streaming to jarvis-core (jarvis/voice/client.py)
client = ["websockets==17.4", "sounddevice", "numpy", "pywebrtc-audio==0.2.0"]
# the voice pipeline on Laptop B (jarvis/voice/README.md; pinned as K4 built against them)
voice = [
  "pipecat-ai[silero]==1.16.0",
  "sherpa-onnx==2.0.1",
  "silero-vad==6.2.3",
  "onnxruntime==1.32.0",
  "anthropic==2.10.0",
  "websockets==17.4",
  "numpy",
  "sounddevice",
  "pywebrtc-audio==0.2.0",
]

# Jarvis's tools on Laptop B (setup-tools.bat; JARVIS_DESIGN_TOOLS.md): browser, documents, Claude agents
tools = [
  "anthropic==2.10.0",
  "claude-agent-sdk==0.2.183",
  "playwright==1.63.0",
  "markitdown[pdf,docx,pptx,xlsx]==0.1.7",
  "pymupdf>=1.24",
  "pyyaml>=6",
]

[tool.setuptools]
packages = ["jarvis_hub", "jarvis_hub.demo", "jarvis", "jarvis.core", "jarvis.secrets", "jarvis.memory", "jarvis.voice", "jarvis.health", "jarvis.tools", "jarvis.browser", "jarvis.canvas", "jarvis.documents", "jarvis.tasks"]

[tool.setuptools.package-data]
"jarvis.tools" = ["*/TOOL.md", "*/handler.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E701", "E702"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "E731"]
