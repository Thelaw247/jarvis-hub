<body class="jv-grid">
  <a class="jv-skip" href="#stage">Skip to the main view</a>
  <!-- ambient region: the backdrop the ambient screen draws into (day dial, standby orb). Empty and unseen otherwise. -->
  <div class="jv-ambient" id="ambient"></div>
  <header class="jv-chrome" id="chrome">
    <span class="jv-chrome__mark" aria-hidden="true">JARVIS</span>
    <a class="jv-chrome__demo" id="demo-chip" href="#/controls" hidden title="Demo mode: a scripted day, not your real data. Replay it from Controls.">Demo<span class="jv-sr"> mode. Open Controls to replay the demo day</span></a>
    <span class="jv-chrome__space"></span>
    <jv-tabs id="tabs"></jv-tabs><!-- the phone's tab bar; elsewhere the page dots under the icon row (components/tabs) -->
  </header>
  <main id="stage" tabindex="-1" aria-label="Jarvis hub"></main>
  <!-- the bottom band, on every tab: the status word left · the icon row (the Rail, with search and the page dots)
       centre, with the caption above it while Jarvis speaks · the orb's dock right -->
  <footer class="jv-foot" id="foot">
    <div class="jv-band__left">
      <jv-status-line id="status"></jv-status-line>
      <jv-working-on id="jobs"></jv-working-on>
    </div>
    <div class="jv-band__centre">
      <jv-caption id="caption"></jv-caption>
      <jv-rail id="rail"></jv-rail>
    </div>
    <div class="jv-band__right" aria-hidden="true"></div>
  </footer>
  <div class="jv-dock" id="dock">
    <jv-orb id="orb" size="corner" state="idle" openable></jv-orb>
  </div>
  <jv-toasts id="toasts"></jv-toasts>
  <jv-command-bar id="command-bar"></jv-command-bar>
  <script type="module" src="core/main.js"></script>
</body>
</html>
